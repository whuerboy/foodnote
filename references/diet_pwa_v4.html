/* V2：卡片更清晰，但保持低饱和度 */
:root{--line:#d9e2d7;--shadow-card:0 5px 18px rgba(67,87,69,.065),0 1px 3px rgba(67,87,69,.035)}
.panel{border-color:#dce4d9;box-shadow:var(--shadow-card);background:#fffefa}
.meal-card{display:flex;align-items:stretch;gap:0;margin:11px 0;border:1px solid #d9e2d6;background:var(--card);border-radius:19px;box-shadow:var(--shadow-card);overflow:hidden}
.meal-view{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:13px 8px 13px 14px;color:inherit;text-align:left}
.meal-view .meal-name,.meal-view .meal-info{display:block}.meal-view .meal-right{display:flex;align-items:center;gap:5px}
.meal-view .meal-right svg{width:14px;height:14px;color:#92a298}
.meal-add{align-self:center;flex:0 0 36px;width:36px;height:36px;border:1px solid #d8e3d7;border-radius:11px;color:#698b70;background:#eef3ed;display:grid;place-items:center;margin-right:12px}
.meal-add svg{width:17px;height:17px}
.meal-card:active,.quick-action:active{background:#f5f8f2}
.quick-action{border-color:#dce4d9;box-shadow:var(--shadow-card);border-radius:17px}
#food-list{box-shadow:var(--shadow-card)}
.food-art{box-shadow:inset 0 0 0 1px rgba(73,93,77,.055)}
.today-date-nav{display:flex;align-items:center;gap:9px;margin:13px 0 6px}
.today-date-nav .icon-btn{width:36px;height:43px;border-radius:13px}
.day-picker{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:9px;background:#fffefa;border:1px solid #dbe3d8;border-radius:15px;padding:8px 10px;box-shadow:var(--shadow-card);height:51px}
.day-picker>svg{width:17px;height:17px;color:#839c86}
.day-picker strong{display:block;font-size:14px;line-height:1.2}
.day-picker small{display:block;color:#85948a;font-size:10px;margin-top:3px}
.day-picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.day-picker input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.today-home-title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:5px 0 0}
.today-home-title h1{font-size:24px}
.go-today{border:0;background:var(--sage-soft);color:#67846f;font-size:11px;padding:8px 11px;border-radius:100px;font-weight:650;white-space:nowrap}
.today-hint{font-size:11px;color:#879588;display:flex;gap:5px;align-items:center;margin-top:11px}
.today-hint svg{width:14px;height:14px}
.summary{margin-top:14px}
.pinned-summary{position:absolute;top:0;left:0;right:0;z-index:3;padding:14px 22px 12px;background:rgba(255,254,250,.97);backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px);border-bottom:1px solid #d5e0d3;box-shadow:0 6px 22px rgba(56,82,59,.1);transform:translateY(-125%);opacity:0;pointer-events:none;transition:transform .18s ease,opacity .18s ease}
.pinned-summary.visible{transform:translateY(0);opacity:1;pointer-events:auto}
.pin-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pin-top strong{font-size:19px;letter-spacing:-.5px}
.pin-top strong small{font-size:11px;color:var(--sub);font-weight:500;letter-spacing:0}
.pin-caption{font-size:10px;color:var(--sub)}
.pin-progress{height:4px;background:#e7ece4;border-radius:99px;overflow:hidden;margin-top:9px}
.pin-progress i{display:block;height:100%;background:var(--sage);border-radius:99px}
.period-choose{margin:15px 0 13px}
.period-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.period-info{text-align:center;flex:1}
.period-info strong{font-size:15px;display:block}
.period-info small{display:block;font-size:10px;color:var(--sub);margin-top:3px}
.stats-overview{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:stretch}
.stat-main{padding:17px 15px;background:#fffefa;border:1px solid #dce4da;border-radius:19px;box-shadow:var(--shadow-card)}
.stat-main .stat-label{font-size:11px;color:var(--sub)}
.stat-main .stat-value{font-size:27px;letter-spacing:-.8px;font-weight:730;margin-top:7px;white-space:nowrap}
.stat-main .stat-value small{font-size:11px;font-weight:500;letter-spacing:0;color:var(--sub)}
.stat-aside{padding:16px;background:#eef3eb;border:1px solid #dce6da;border-radius:19px;display:flex;flex-direction:column;justify-content:space-between}
.stat-aside strong{font-size:23px;font-weight:720}
.stat-aside small{font-size:11px;color:var(--sub)}
.metric-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}
.metric-tabs button{background:#eef1ea;border:1px solid #e2e8df;color:#738275;border-radius:10px;font-size:11px;padding:9px 2px}
.metric-tabs button.selected{background:#e1ebdf;border-color:#b9cebb;color:#4a7054;font-weight:700}
.chart-card{padding:18px 15px 14px}
.chart-bars{height:178px;display:flex;justify-content:space-around;align-items:flex-end;gap:6px;padding-top:20px;border-bottom:1px solid #dfe7db}
.chart-column{border:0;background:transparent;padding:0;color:inherit;height:100%;flex:1;min-width:0;max-width:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;position:relative;cursor:pointer}
.chart-bar{width:min(100%,25px);min-height:3px;border-radius:6px 6px 2px 2px;background:#a6bba8;border:1px solid rgba(79,115,84,.08);transition:height .15s}
.chart-bar.none{background:#e9ede6;border:1px dashed #d5dfd1;height:3px!important}
.chart-column.selected .chart-bar{background:#789984}
.chart-column:hover .chart-bar{background:#849f89}
.chart-labels{display:flex;gap:6px;justify-content:space-around;margin-top:9px}
.chart-labels span{flex:1;min-width:0;max-width:44px;text-align:center;color:#87948b;font-size:10px;white-space:nowrap}
.chart-note{font-size:11px;color:#718274;line-height:1.65;padding:12px;background:#f1f5ee;border-radius:12px;margin-top:13px}
.stats-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats-details .stat-chip{background:#f5f6f1;border:1px solid #e5e9e0;border-radius:13px;padding:11px 8px}
.stats-details .stat-chip small{display:block;color:var(--sub);font-size:10px;margin-bottom:7px}
.stats-details .stat-chip strong{font-size:16px}
.meal-detail-list{margin:16px 0 20px;display:flex;flex-direction:column;gap:9px}
.meal-detail-item{display:flex;align-items:center;gap:11px;border:1px solid #e0e7dc;background:#fffefa;border-radius:15px;padding:10px;width:100%;text-align:left;color:inherit}
.meal-detail-item strong{display:block;font-size:12px}
.meal-detail-item small{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.meal-detail-item .meal-right{margin-left:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

function statsRange(){
 const d=new Date(demoToday+'T12:00:00');let start,end;
 if(state.statsPeriod==='week'){
   const monday=(d.getDay()+6)%7;d.setDate(d.getDate()-monday+state.statsOffset*7);start=new Date(d);end=new Date(d);end.setDate(end.getDate()+6);
 }else if(state.statsPeriod==='month'){
   start=new Date(d.getFullYear(),d.getMonth()+state.statsOffset,1,12);
   end=new Date(start.getFullYear(),start.getMonth()+1,0,12);
 }else{
   start=new Date(d.getFullYear()+state.statsOffset,0,1,12);
   end=new Date(start.getFullYear(),11,31,12);
 }
 return {start:localDay(start),end:localDay(end)};
}
function statsModel(){
 const {start,end}=statsRange();
 const relevant=entries.filter(e=>e.date>=start&&e.date<=end);
 const byDay=new Map();
 for(const e of relevant){if(!byDay.has(e.date))byDay.set(e.date,[]);byDay.get(e.date).push(e)}
 let groups=[];
 if(state.statsPeriod==='week'){
  for(let i=0;i<7;i++){const d=shiftDay(start,i);groups.push({label:weekDay(d).slice(-1),description:dateHeaderLabel(d),dates:[d]})}
 }else if(state.statsPeriod==='month'){
  const last=new Date(end+'T12:00:00').getDate();for(let s=1;s<=last;s+=7){const t=Math.min(s+6,last);const dates=[];for(let x=s;x<=t;x++)dates.push(start.slice(0,8)+String(x).padStart(2,'0'));groups.push({label:`${s}-${t}`,description:`${s}–${t}日`,dates})}
 }else{
  for(let i=1;i<=12;i++){const month=start.slice(0,4)+'-'+String(i).padStart(2,'0');const days=new Date(Number(start.slice(0,4)),i,0).getDate();const dates=Array.from({length:days},(_,d)=>month+'-'+String(d+1).padStart(2,'0'));groups.push({label:String(i)+'月',description:`${i}月`,dates})}
 }
 groups=groups.map(g=>{
  const present=g.dates.filter(d=>byDay.has(d));
  const totals=present.map(d=>sum(byDay.get(d)));
  const average={};for(const k of ['kcal','p','c','f'])average[k]=totals.length?totals.reduce((a,v)=>a+v[k],0)/totals.length:null;
  return {...g,days:present.length,average};
 });
 const totals=Array.from(byDay.values(),dayEntries=>sum(dayEntries));
 const avg={};for(const k of ['kcal','p','c','f'])avg[k]=totals.length?totals.reduce((a,v)=>a+v[k],0)/totals.length:null;
 const eligibleEnd=end>demoToday?demoToday:end;const availableDays=eligibleEnd<start?0:Math.round((new Date(eligibleEnd+'T12:00:00')-new Date(start+'T12:00:00'))/86400000)+1;
 const periodLabel=state.statsPeriod==='week'?`${isoDate(start)} – ${isoDate(end)}`:state.statsPeriod==='month'?`${start.slice(0,4)}年${Number(start.slice(5,7))}月`:`${start.slice(0,4)}年`;
 return {start,end,periodLabel,groups,recorded:totals.length,availableDays,avg,proteinMet:totals.filter(v=>v.p>=goals.p).length,kcalTotal:totals.reduce((a,v)=>a+v.kcal,0)};
}

 const max=Math.max(...st.groups.map(g=>g.average[key]||0),key==='kcal'?goals.kcal:goals[key],1);

 return `${title('饮食统计','观察一周、一个月或一年的营养摄入')}<div class="seg period-choose">${[['week','一周'],['month','一个月'],['year','一年']].map(([v,l])=>`<button data-action="stats-period" data-period="${v}" class="${state.statsPeriod===v?'selected':''}">${l}</button>`).join('')}</div><div class="period-nav"><button class="icon-btn" data-action="stats-shift" data-offset="-1" aria-label="上一个统计周期">${ui('left')}</button><div class="period-info"><strong>${st.periodLabel}</strong><small>当前查看：${state.statsPeriod==='week'?'每周':state.statsPeriod==='month'?'每月':'每年'}趋势</small></div><button class="icon-btn" data-action="stats-shift" data-offset="1" ${state.statsOffset>=0?'disabled':''} aria-label="下一个统计周期">${ui('arrow')}</button></div><div class="stats-overview"><div class="stat-main"><div class="stat-label">记录日平均热量</div><div class="stat-value">${st.avg.kcal===null?'—':Math.round(st.avg.kcal)} <small>kcal / 天</small></div><div class="small muted" style="margin-top:10px">目标 ${goals.kcal} kcal / 天</div></div><div class="stat-aside"><small>本周期有记录</small><div><strong>${st.recorded}</strong><small> / ${st.availableDays} 天</small></div><small>未记录日不计入日均</small></div></div><div class="section-heading"><h2>摄入趋势</h2><span class="tiny muted">${state.statsPeriod==='week'?'按天':state.statsPeriod==='month'?'按7天分组':'按月'}展示日均</span></div><div class="metric-tabs">${[['kcal','热量'],['p','蛋白质'],['c','碳水'],['f','脂肪']].map(([k,t])=>`<button class="${key===k?'selected':''}" data-action="stats-metric" data-metric="${k}">${t}</button>`).join('')}</div><section class="panel chart-card"><div class="row"><strong>${metricInfo[0]} · 记录日平均</strong><span class="tiny muted">${metricInfo[1]}</span></div><div class="chart-bars" role="group" aria-label="${metricInfo[0]}趋势图">${st.groups.map((g,i)=>{const v=g.average[key];return `<button class="chart-column ${selectedIndex===i?'selected':''}" data-action="stats-select" data-index="${i}" aria-label="${g.description}：${v===null?'没有饮食记录':display(v)+' '+metricInfo[1]}"><span class="chart-bar ${v===null?'none':''}" style="height:${v===null?3:Math.max(3,v/max*145)}px"></span></button>`}).join('')}</div><div class="chart-labels">${st.groups.map(g=>`<span>${g.label}</span>`).join('')}</div><div class="chart-note">${selected?`${selected.description}：${selected.days?`${display(selected.average[key])} ${metricInfo[1]} / 记录日均（记录 ${selected.days} 天）`:selected.dates.every(d=>d>demoToday)?'日期尚未到来':'没有饮食记录'}`:'本周期暂无数据'}。浅灰短条表示尚无记录或日期未到，不代表摄入0。</div></section><div class="section-heading"><h2>营养汇总</h2></div><div class="stats-details">${[['蛋白质',st.avg.p,'g'],['碳水',st.avg.c,'g'],['脂肪',st.avg.f,'g']].map(([l,v,u])=>`<div class="stat-chip"><small>${l} / 日均</small><strong>${v===null?'—':round(v)}<span class="tiny muted"> ${u}</span></strong></div>`).join('')}</div><div class="check-tip">${ui('info')}<span>这份原型使用生成的历史演示记录。统计按照有饮食记录的日期求平均，未来正式版将读取本地数据库。</span></div>`;

function settingsPage(){return `${title('我的设置','营养目标、数据与应用偏好')}<div class="section-heading"><h2>每日营养目标</h2><button class="text-btn" data-action="goal-sheet">修改目标 ${ui('arrow')}</button></div><section class="panel"><ul class="datalist">${[['目标热量',`${goals.kcal} kcal`],['蛋白质',`${goals.p} g`],['碳水化合物',`${goals.c} g`],['脂肪',`${goals.f} g`]].map(([l,v])=>`<li><span>${l}</span><strong>${v}</strong></li>`).join('')}</ul></section><div class="section-heading"><h2>数据管理</h2></div><section class="panel" style="padding:3px 15px"><button class="settings-row" data-action="export"><span class="settings-icon">${ui('download')}</span><span class="settings-copy"><strong>导出演示记录</strong><div>下载 JSON 文件，保存到「文件」App</div></span>${ui('arrow')}</button><button class="settings-row" data-action="import"><span class="settings-icon">${ui('upload')}</span><span class="settings-copy"><strong>从演示备份恢复</strong><div>选择本原型导出的 JSON 文件</div></span>${ui('arrow')}</button></section><div class="section-heading"><h2>数据说明</h2></div><div class="status-note">当前是设计验证原型：操作只保存在本次打开的页面中，刷新页面会重置。正式版本计划使用 Dexie + IndexedDB 持久化，并提供备份与离线使用。</div><div class="section-heading"><h2>关于应用</h2></div><section class="panel"><ul class="datalist"><li><span>应用名称</span><strong>食简 Foodnote</strong></li><li><span>当前版本</span><strong>UI 交互原型 0.1</strong></li><li><span>设计方向</span><strong>柔和 · 清晰 · iPhone优先</strong></li></ul></section>`}
function createPage(){const e=foods.find(x=>x.id===state.editingFood);return `${title(e?'编辑食物':'手动创建食物',e?'修改不会覆盖已经保存的餐次快照':'把常吃食品保存到菜单，方便下次复用',true)}<label class="label">食物名称 <span class="required">*</span></label><input class="field" id="new-name" placeholder="例如：冷冻鸡胸肉" value="${e?safe(e.name):''}" maxlength="40"><label class="label">食品类型</label><div class="seg" style="margin:4px 0">${['食材','包装食品'].map(k=>`<button data-action="set-kind" data-kind="${k}" class="${(e?.kind||state.creationKind)===k?'selected':''}">${k}</button>`).join('')}</div><label class="label">食物图标</label><div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:8px">${['oats','shrimp','chicken','broccoli','potato','milk','rice','egg'].map(k=>{const fake={icon:k};return `<button class="${(e?.icon||state.iconChoice)===k?'chip active':'chip'}" data-action="pick-icon" data-icon="${k}" style="padding:4px">${foodArt(fake,'small-art')}</button>`}).join('')}</div><label class="label">营养数值对应的重量状态</label><select class="field" id="new-basis">${['生重','干重','熟重','包装成品'].map(v=>`<option ${e?.basis===v?'selected':''}>${v}</option>`).join('')}</select><label class="label">营养数值对应的单位</label><select class="field" id="new-unit"><option value="g" ${e?.unit==='g'?'selected':''}>每100g</option><option value="ml" ${e?.unit==='ml'?'selected':''}>每100mL</option></select><div class="section-heading"><h2>每100单位营养数据</h2></div><div class="status-note">下面所有数字均对应你上面选择的每100g或每100mL，不能混填「每份」数值。</div><div class="nutri-grid">${[['热量','kcal','kcal'],['蛋白质','p','g'],['碳水化合物','c','g'],['脂肪','f','g']].map(([name,key,unit])=>`<div><label class="label" for="nutri-${key}">${name} (${unit})</label><input id="nutri-${key}" class="field" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0" value="${e?e[key]:''}"></div>`).join('')}</div><label class="label">数据来源</label><select class="field" id="new-source"><option>手动录入</option><option>包装营养表</option><option>食品成分数据库</option></select><div class="fixed-action"><button function recipePage(){const r=state.recipeDraft,parts=state.recipeParts;const total=parts.reduce((a,p)=>{const f=foods.find(x=>x.id===p.foodId);if(!f)return a;const n=calc(f,p.qty);return {kcal:a.kcal+n.kcal,p:a.p+n.p,c:a.c+n.c,f:a.f+n.f}}, {kcal:0,p:0,c:0,f:0});return `${title('创建组合菜品','将常用食材组合为一道可重复记录的菜品',true)}<label class="label">菜品名称</label><input class="field" id="recipe-name" value="${safe(r.name||'')}" placeholder="例如：虾仁土豆餐"><div class="section-heading"><h2>食材清单</h2><button class="text-btn" data-action="recipe-food-sheet">＋ 添加食材</button></div><section class="panel" style="padding:9px 14px">${parts.length?parts.map((p,i)=>{const f=foods.find(x=>x.id===p.foodId);return `<div class="row-calc"><span>${safe(f?.name||'未知食材')}</span><span>${p.qty} ${f?.unit||'g'} <button class="ghost-btn deleted" data-action="remove-part" data-index="${i}" aria-label="移除食材">${ui('close')}</button></span></div>`}).join(''):'<div class="tiny muted" style="padding:12px 0">尚未添加食材。点击右上方「添加食材」。</div>'}</section><div class="nutri-grid"><div><label class="label">成品总重量（g）</label><input class="field" id="recipe-yield" inputmode="decimal" type="number" min="1" placeholder="例如 650" value="${safe(r.yieldWeight||'')}"></div><div><label class="label">可分成几份</label><input class="field" id="recipe-servings" inputmode="numeric" type="number" min="1" placeholder="例如 2" value="${safe(r.servings||'')}"></div></div><div class="section-heading"><h2>配方总营养（估算）</h2></div><div class="preview"><div class="preview-grid" style="margin:0">${[['热量',total.kcal,'kcal'],['蛋白质',total.p,'g'],['碳水',total.c,'g'],['脂肪',total.f,'g']].map(([a,b,c])=>`<div><strong>${round(b)}</strong><span>${a} (${c})</span></div>`).join('')}</div></div><div class="check-tip">${ui('info')}<span>成品重量与食材总重可能不同；每100g成品营养由配方总营养除以成品总重推算。</span></div><div class="fixed-action"><button class="primary-btn full" data-action="save-recipe">保存组合菜品</button></div>`}

 const tabs=[['today','home','首页'],['foods','menu','菜单'],['stats','chart','统计'],['settings','settings','我的']];

function overlay(){switch(state.sheet){case 'meal-detail':{const meal=state.activeMeal,es=dayEntries().filter(e=>e.meal===meal),total=sum(es);return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet"><div class="sheet-handle"></div><div class="meal-sheet-toolbar"><div><h3 class="sheet-title">${isoDate(state.date)} · ${meal}</h3><div class="small muted">${es.length} 项食物 · ${Math.round(total.kcal)} kcal</div></div><div class="meal-sheet-toolbar-right"><button class="header-action" data-action="meal" data-meal="${meal}" aria-label="添加食物到${meal}">${ui('plus')} 添加</button><button class="icon-btn" data-action="close-sheet" aria-label="关闭">${ui('close')}</button></div></div><div class="swipe-hint">${ui('left')} 单条食物左滑删除；点击可以编辑</div><div class="meal-detail-list">${es.length?es.map(e=>{const f=foods.find(x=>x.id===e.foodId)||{icon:'recipe'};return swipeRow(`<button class="meal-detail-item" data-action="entry-sheet" data-id="${e.id}">${foodArt(f,'small-art')}<span class="grow"><strong>${safe(e.name)}</strong><small>${e.qty}${e.unit} · ${e.basis} · 蛋白${round(e.snapshot.p)}g</small></span><span class="meal-right">${Math.round(e.snapshot.kcal)} kcal</span>${ui('arrow')}</button>`,'entry',e.id)}).join(''):`<div class="empty">这一天的${meal}还没有记录</div>`}</div></div></div>`;}case 'global-add':return sheet('选择添加内容',[

['new-food','plus','手动创建食物','填写营养数据和重量基准'],['new-recipe','book','创建组合菜品','按多个食材计算整道菜'],['scan-label','camera','拍营养成分表','联网识别后核对营养数字'],['scan-dish','camera','拍摄实际食物','识别类别，再手动确认份量']]);case 'scan-start':return sheet('选择拍照识别方式', [['scan-label','camera','拍营养成分表','为包装食品创建营养信息'],['scan-dish','camera','拍摄实际食物','识别食物种类并记录份量']]);case 'pick-food':return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet"><div class="sheet-handle"></div><div class="row"><h3 class="sheet-title">选择要记录的食物</h3><button class="icon-btn" data-action="close-sheet">${ui('close')}</button></div>${chooseFoodRows()}</div></div>`;case 'entry':{const e=entries.find(x=>x.id===state.entryToEdit);return sheet(`修改记录：${safe(e?.name||'')}`,[['edit-entry','edit','修改食用重量','更改这一餐记录的重量与营养'],['delete-entry','trash','删除这条记录','不会删除菜单中的食物']]);}case 'confirm-delete-item':{
 const d=state.pendingDelete;if(!d)return '';
 const f=d.type==='food'?foods.find(x=>x.id===d.id):null;
 const e=d.type==='entry'?entries.find(x=>x.id===d.id):null;
 const titles={food:`从菜单删除「${safe(f?.name||'该菜品')}」？`,meal:`删除${isoDate(state.date)}的${safe(d.id)}？`,entry:`删除「${safe(e?.name||'这条食物')}」的记录？`};

 return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet"><div class="sheet-handle"></div><h3 class="sheet-title">${titles[d.type]}</h3><div class="small muted" style="margin:12px 0 20px;line-height:1.7">${descriptions[d.type]}</div><button class="primary-btn full" style="background:#bb8980" data-action="confirm-delete-item">${d.type==='food'?'删除这个菜品':d.type==='meal'?'删除这餐的全部记录':'删除这条记录'}</button><div class="space12"></div><button class="outline-btn full" data-action="close-sheet">取消，保留数据</button></div></div>`;
 }
 case 'delete-confirm':return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet"><div class="sheet-handle"></div><h3 class="sheet-title">确认删除这条饮食记录？</h3><div class="small muted" style="margin-bottom:18px">只会删除这条记录，菜单中的食物仍会保留。</div><button class="outline-btn full" data-action="close-sheet">保留这条记录</button><div class="space12"></div><button class="primary-btn full" style="background:#b58a82" data-action="confirm-delete">删除这条记录</button></div></div>`;case 'goals':return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet"><div class="sheet-handle"></div><h3 class="sheet-title">修改每日营养目标</h3>${[['kcal','目标热量','kcal'],['p','蛋白质','g'],['c','碳水','g'],['f','脂肪','g']].map(([k,n,u])=>`<label class="label">${n} (${u})</label><input class="field" id="goal-${k}" type="number" inputmode="decimal" min="0" value="${goals[k]}">`).join('')}<div class="space16"></div><button class="primary-btn full" data-action="save-goals">保存每日目标</button></div></div>`;case 'recipe-food':return sheet('选择食材加入配方',foods.filter(f=>f.kind!=='组合菜品').map(f=>[`part:${f.id}`,'plus',f.name,`${f.basis} · 每100${f.unit} ${round(f.kcal)} kcal`]));case 'recipe-qty':{const f=foods.find(x=>x.id===state.partToAdd);return `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet"><div class="sheet-handle"></div><h3 class="sheet-title">加入 ${safe(f?.name||'食材')}</h3><label class="label">用量（${f?.unit||'g'}，${f?.basis||'生重'}）</label><input class="field" id="part-qty" type="number" inputmode="decimal" min="1" value="100"><div class="space16"></div><button class="primary-btn full" data-action="confirm-part">加入配方</button></div></div>`}default:return ''}}

function render(keepScroll=false){const main=document.getElementById('content'),old=main.scrollTop;let html='';switch(state.page){case 'today':html=todayPage();break;case 'foods':html=foodsPage();break;case 'detail':html=foodDetail();break;case 'add':html=addPage();break;case 'stats':html=statisticsPage();break;case 'diary':html=diaryPage();break;case 'settings':html=settingsPage();break;case 'create':html=createPage();break;case 'scan':html=scanPage();break;case 'recipe':html=recipePage();break;}main.innerHTML=html;document.getElementById('bottom-nav').innerHTML=renderNav();document.getElementById('overlay').innerHTML=overlay();main.scrollTop=keepScroll?old:0;updatePinned()}
function updatePinned(){const p=document.getElementById('pinned-summary'),main=document.getElementById('content');if(state.page!=='today'){p.classList.remove('visible');p.setAttribute('aria-hidden','true');return}const s=sum(dayEntries());p.innerHTML=`<div class="pin-top"><div><div class="pin-caption">${dateHeaderLabel(state.date)} · 已摄入</div><strong>${Math.round(s.kcal)} <small>/ ${goals.kcal} kcal</small></strong></div><button class="go-today" data-action="go-today" ${state.date===demoToday?'hidden':''}>返回今天</button></div><div class="pin-progress"><i style="width:${percent(s.kcal,goals.kcal)}%"></i></div>`;syncPinned()}

case 'edit-food':state.editingFood=el.dataset.id;state.iconChoice=currentFood().icon;state.creationKind=currentFood().kind;setPage('create');break;
case 'save-food':{const get=id=>document.getElementById(id)?.value;const name=get('new-name')?.trim();const nums=['kcal','p','c','f'].map(k=>Number(get('nutri-'+k)));if(!name||nums.some(n=>!Number.isFinite(n)||n<0)||['kcal','p','c','f'].some(k=>get('nutri-'+k)==='')){toast('请填写名称和四项有效营养数据');break;}const edit=foods.find(f=>f.id===state.editingFood);const f={id:edit?.id||'u'+Date.now(),name,kind:state.creationKind,cat:state.creationKind==='包装食品'?'包装食品':'自定义',unit:get('new-unit'),basis:get('new-basis'),icon:state.iconChoice,kcal:nums[0],p:nums[1],c:nums[2],f:nums[3],source:get('new-source'),favorite:edit?.favorite||false};if(edit){Object.assign(edit,f)}else foods.unshift(f);state.selectedFood=f.id;state.editingFood=null;setPage('detail');toast(edit?'已保存食物修改':'食物已保存到菜单');break;}
case 'pick-icon':state.iconChoice=el.dataset.icon;document.querySelectorAll('[data-action="pick-icon"]').forEach(b=>b.className=b.dataset.icon===state.iconChoice?'chip active':'chip');break;
case 'set-kind':state.creationKind=el.dataset.kind;document.querySelectorAll('[data-action="set-kind"]').forEach(b=>b.classList.toggle('selected',b.dataset.kind===state.creationKind));break;
case 'add-entry':state.editingEntry=null;state.returnPage=state.page;state.selectedFood='shrimp';state.quantity=150;state.meal='晚餐';setPage('add');break;
case 'meal':state.meal=el.dataset.meal;state.editingEntry=null;state.returnPage=state.page;state.selectedFood='shrimp';state.quantity=150;setPage('add');break;
case 'select-from-detail':state.editingEntry=null;state.returnPage='foods';state.quantity=100;state.meal='午餐';setPage('add');break;
case 'set-meal':state.meal=el.dataset.meal;render(true);break;
case 'food-picker':state.sheet='pick-food';render(true);break;
case 'choose-food':state.selectedFood=el.dataset.id;state.sheet=null;render(true);break;
case 'quick-qty':state.quantity=Number(el.dataset.qty);render(true);break;
case 'save-entry':{const q=Number(state.quantity);if(!Number.isFinite(q)||q<=0||q>10000){toast('请输入大于0的有效重量');break;}const f=currentFood();if(state.editingEntry){const e=entries.find(x=>x.id===state.editingEntry);if(e){Object.assign(e,{meal:state.meal,foodId:f.id,qty:q,unit:f.unit,basis:f.basis,name:f.name,snapshot:calc(f,q)});}}else entries.push({id:'e'+Date.now(),date:state.date,meal:state.meal,foodId:f.id,qty:q,unit:f.unit,basis:f.basis,name:f.name,snapshot:calc(f,q)});const edited=!!state.editingEntry;state.editingEntry=null;setPage('today');toast(edited?'已保存这条记录':'已添加到'+state.meal);break;}
case 'go-today':state.date=demoToday;render();break;
case 'meal-detail':state.activeMeal=el.dataset.meal;state.sheet='meal-detail';render(true);break;
case 'stats-period':state.statsPeriod=el.dataset.period;state.statsOffset=0;state.statsSelected=null;render(true);break;
case 'stats-shift':state.statsOffset=Math.min(0,state.statsOffset+Number(el.dataset.offset));state.statsSelected=null;render(true);break;
case 'stats-metric':state.statsMetric=el.dataset.metric;render(true);break;
case 'stats-select':state.statsSelected=Number(el.dataset.index);render(true);break;
case 'date-offset':{moveHomeDate(Number(el.dataset.offset));break;}
case 'entry-sheet':state.entryToEdit=el.dataset.id;state.sheet='entry';render(true);break;
case 'edit-entry':{const e=entries.find(x=>x.id===state.entryToEdit);if(!e)break;state.selectedFood=e.foodId;state.quantity=e.qty;state.meal=e.meal;state.editingEntry=e.id;state.returnPage='today';setPage('add');break;}
case 'delete-entry':state.pendingDelete={type:'entry',id:state.entryToEdit};state.sheet='confirm-delete-item';render(true);break;
case 'confirm-delete':entries=entries.filter(x=>x.id!==state.entryToEdit);state.sheet=null;render(true);toast('已删除这条饮食记录');break;
case 'swipe-request-delete':{
 const type=el.dataset.kind,id=el.dataset.id;
 if(type==='food'&&!foods.some(f=>f.id===id))break;
 if(type==='meal'&&!dayEntries().some(e=>e.meal===id))break;
 if(type==='entry'&&!entries.some(e=>e.id===id))break;
 state.pendingDelete={type,id};state.sheet='confirm-delete-item';render(true);break;
 }
 case 'confirm-delete-item':{
 const d=state.pendingDelete;if(!d)break;
 if(d.type==='food'){
  foods=foods.filter(x=>x.id!==d.id);
  if(state.selectedFood===d.id)state.selectedFood=foods[0]?.id||null;
  toast('菜品已从菜单删除，历史记录仍然保留');
 }else if(d.type==='meal'){
  entries=entries.filter(x=>!(x.date===state.date&&x.meal===d.id));
  toast(`已删除${d.id}的全部记录`);
 }else{
  entries=entries.filter(x=>x.id!==d.id);
  toast('已删除这条饮食记录');
 }
 state.pendingDelete=null;state.sheet=null;render(true);break;
 }
 case 'close-sheet':state.sheet=null;state.pendingDelete=null;render(true);break;
case 'goal-sheet':state.sheet='goals';render(true);break;
case 'save-goals':{const next={};for(const k of ['kcal','p','c','f']){const x=Number(document.getElementById('goal-'+k)?.value);if(!Number.isFinite(x)||x<=0){toast('营养目标必须是正数');return}next[k]=x;}goals=next;state.sheet=null;render(true);toast('每日营养目标已更新');break;}
case 'export':{const doc={format:'foodnote-wireframe',version:1,foods,entries,goals};const blob=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='foodnote-demo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出演示数据');break;}
case 'import':{if(!document.getElementById('import-json')){const x=document.createElement('input');x.id='import-json';x.type='file';x.accept='.json,application/json';x.hidden=true;x.onchange=async()=>{try{const data=JSON.parse(await x.files[0].text());if(data.format!=='foodnote-wireframe'||!Array.isArray(data.foods)||!Array.isArray(data.entries)||!data.goals||!data.foods.every(f=>f.id&&f.name&&Number.isFinite(f.kcal))||!data.entries.every(e=>e.id&&e.date&&e.snapshot)){throw Error('bad format')}foods=data.foods;entries=data.entries;goals=data.goals;state.selectedFood=foods[0]?.id;render();toast('演示备份已恢复');}catch(err){toast('文件格式不支持，未覆盖当前数据')}x.value=''};document.body.appendChild(x)}document.getElementById('import-json').click();break;}
case 'recipe-food-sheet':state.recipeDraft.name=document.getElementById('recipe-name')?.value||'';state.recipeDraft.yieldWeight=document.getElementById('recipe-yield')?.value||'';state.recipeDraft.servings=document.getElementById('recipe-servings')?.value||'';state.sheet='recipe-food';render(true);break;
case 'confirm-part':{const q=Number(document.getElementById('part-qty')?.value);if(!Number.isFinite(q)||q<=0){toast('请输入有效食材重量');break;}state.recipeParts.push({foodId:state.partToAdd,qty:q});state.sheet=null;render(true);break;}
case 'remove-part':state.recipeDraft.name=document.getElementById('recipe-name')?.value||'';state.recipeDraft.yieldWeight=document.getElementById('recipe-yield')?.value||'';state.recipeDraft.servings=document.getElementById('recipe-servings')?.value||'';state.recipeParts.splice(Number(el.dataset.index),1);render(true);break;
case 'save-recipe':{const name=document.getElementById('recipe-name')?.value.trim();const yieldWeight=Number(document.getElementById('recipe-yield')?.value);const servings=Number(document.getElementById('recipe-servings')?.value);if(!name||!state.recipeParts.length||!Number.isFinite(yieldWeight)||yieldWeight<=0||!Number.isInteger(servings)||servings<=0){toast('请填写名称、食材、成品重量与正整数份数');break;}const total=state.recipeParts.reduce((a,p)=>{const f=foods.find(x=>x.id===p.foodId);const n=calc(f,p.qty);return {kcal:a.kcal+n.kcal,p:a.p+n.p,c:a.c+n.c,f:a.f+n.f}},{kcal:0,p:0,c:0,f:0});const f={id:'r'+Date.now(),name,kind:'组合菜品',cat:'自制菜品',unit:'g',basis:'成品重',icon:'recipe',kcal:total.kcal/yieldWeight*100,p:total.p/yieldWeight*100,c:total.c/yieldWeight*100,f:total.f/yieldWeight*100,source:'按原料和成品重量估算',favorite:false,parts:[...state.recipeParts],yieldWeight,servings};foods.unshift(f);state.selectedFood=f.id;state.recipeParts=[];state.recipeDraft={};setPage('detail');toast('组合菜品已保存');break;}
default:if(action.startsWith('part:')){state.partToAdd=action.slice(5);state.sheet='recipe-qty';render(true);break;}
}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-route],[data-action]');if(!t)return;if(t.classList.contains('sheet-backdrop')&&e.target!==t)return;if(t.dataset.route){state.search='';state.filter='全部';setPage(t.dataset.route);return}clickAction(t.dataset.action,t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.input==='search'){state.search=t.value;document.getElementById('food-list').innerHTML=foodsList()}if(t.dataset.input==='quantity'){state.quantity=t.value;document.getElementById('nutrition-preview').innerHTML=previewNutrition();}});
document.addEventListener('change',e=>{if(e.target.id==='home-date'){if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)&&e.target.value<=demoToday){state.date=e.target.value;render(true)}return;}if(e.target.id==='capture-file'){const f=e.target.files?.[0];if(f){if(state.scanImage)URL.revokeObjectURL(state.scanImage);state.scanImage=URL.createObjectURL(f);render(true);toast('已选择照片；AI识别尚未接入');}}});
document.getElementById('content').addEventListener('scroll',syncPinned,{passive:true});
let rowGesture=null;
let suppressRowClickUntil=0;
function closeAllSwipeRows(except=null){
 document.querySelectorAll('.swipe-wrap.open').forEach(r=>{
  if(r!==except){r.classList.remove('open');r.querySelector('.swipe-front')?.style.removeProperty('transform')}
 });
}
document.addEventListener('pointerdown',e=>{
 const row=e.target.closest('.swipe-wrap');
 if(!row||e.target.closest('.swipe-delete-action')||e.button!==0)return;
 closeAllSwipeRows(row);
 rowGesture={row,id:e.pointerId,x:e.clientX,y:e.clientY,base:row.classList.contains('open')?-96:0,axis:null,offset:0};
},{passive:true});
document.addEventListener('pointermove',e=>{
 const g=rowGesture;if(!g||g.id!==e.pointerId)return;
 const dx=e.clientX-g.x,dy=e.clientY-g.y;
 if(!g.axis&&Math.max(Math.abs(dx),Math.abs(dy))>9)g.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';
 if(g.axis!=='x')return;
 g.row.classList.add('dragging');
 g.offset=Math.min(0,Math.max(-96,g.base+dx));
 g.row.querySelector('.swipe-front').style.transform=`translate3d(${g.offset}px,0,0)`;
},{passive:true});
function endRowGesture(e){
 const g=rowGesture;if(!g||g.id!==e.pointerId)return;
 const dx=e.clientX-g.x;
 g.row.classList.remove('dragging');
 const front=g.row.querySelector('.swipe-front');
 if(g.axis==='x'&&Math.abs(dx)>20){
  g.row.classList.toggle('open',g.offset<-48);
  suppressRowClickUntil=Date.now()+450;
 }else if(g.axis==='x'&&Math.abs(dx)>8){
  suppressRowClickUntil=Date.now()+450;
 }
 front.style.removeProperty('transform');
 rowGesture=null;
}
document.addEventListener('pointerup',endRowGesture,{passive:true});
document.addEventListener('pointercancel',e=>{
 if(!rowGesture||rowGesture.id!==e.pointerId)return;
 rowGesture.row.classList.remove('dragging');
 rowGesture.row.querySelector('.swipe-front')?.style.removeProperty('transform');
 rowGesture=null;
},{passive:true});
document.addEventListener('click',e=>{
 if(Date.now()<suppressRowClickUntil&&e.target.closest('.swipe-wrap')&&!e.target.closest('.swipe-delete-action')){
  e.preventDefault();e.stopImmediatePropagation();
 }
},true);

// 只响应明确的水平手势；纵向滚动和表单交互由浏览器原生处理。
let swipeStart=null;
document.getElementById('content').addEventListener('touchstart',e=>{if(state.page!=='today'||e.touches.length!==1||e.target.closest('input,select,textarea,.day-picker,.swipe-wrap')){swipeStart=null;return}const t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY,at:Date.now()};},{passive:true});
document.getElementById('content').addEventListener('touchend',e=>{if(!swipeStart||state.page!=='today'||e.changedTouches.length!==1)return;const t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>=65&&Math.abs(dx)>Math.abs(dy)*1.4&&Math.abs(dx)<700){moveHomeDate(dx<0?1:-1)}},{passive:true});
// 桌面浏览器可使用触控板或鼠标模拟，避免横滑与文字选择冲突。

render();</script>
